[project]
name = "adjagent"
version = "0.1.0"
description = "Manual adjustments agent: validates journal entries, explains decisions, posts with lineage"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
adjagent = "adjagent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
